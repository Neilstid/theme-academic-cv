name: Daily Blog Generator

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Install uv"
        uses: astral-sh/setup-uv@v5 # v8.1.0

      - name: "Set up Python"
        run: uv sync --locked --all-extras --dev

      - name: "run script"
        run: uv run script/argos/main.py --config scripts/argos/feeds/ai_research.yaml --output content/post/daily_ai/daily_ai_{date}.md

      - name: Commit et Push des modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto: Nouveau post de blog du $(date +'%Y-%m-%d')" || echo "Rien à commiter"
          git push
